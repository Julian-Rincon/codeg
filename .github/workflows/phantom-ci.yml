name: Phantom CI

on:
  push:
    branches:
      - "local/**"
      - "merge/**"
      - "phantom/**"
  workflow_dispatch:

env:
  RUST_BACKTRACE: short
  INSTA_UPDATE: "no"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

concurrency:
  group: phantom-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: Phantom hooks survive the merge
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/phantom-verificar-fork.sh .

  frontend:
    name: Frontend (tsc + lint + vitest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint .
      - name: vitest (limited workers to avoid timing flakes)
        run: pnpm exec vitest run --maxWorkers=2

  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: phantom-ci-linux

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Prepare Tauri frontendDist placeholder
        run: |
          mkdir -p out
          printf '<!doctype html><html><body></body></html>\n' > out/index.html

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --features test-utils --lib

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --features test-utils -- -D warnings

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Phantom UI Azul General</title>
  <desc id="desc">A blue phantom-shaped mark for Phantom UI.</desc>
